name: Validate templates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Templates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/validate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Every problem becomes an annotation on the file it is in.
      - run: npm run validate
