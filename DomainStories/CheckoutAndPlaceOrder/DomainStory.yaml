name: Check out and place an order
description: >-
  A customer checks out a cart, provides contact and delivery details, and
  applies an active promotion. The payment provider captures the payment and
  the order management service places the order.

sentences:
  - actor: Checkout/Customer
    activity: begins checkout for
    workObject: ShoppingCart
    recipient: CheckoutService

  - actor: CheckoutService
    activity: gets an active discount as
    workObject: DiscountApplication
    recipient: Promotion/PromotionService
    recipientActivity: from

  - actor: Checkout/Customer
    activity: provides details for
    workObject: Checkout
    recipient: CheckoutService

  - actor: Checkout/Customer
    activity: selects delivery for
    workObject: Checkout
    recipient: CheckoutService

  - actor: Checkout/Customer
    activity: completes
    workObject: Checkout
    recipient: CheckoutService

  - actor: CheckoutService
    activity: asks for
    workObject: Payment
    recipient: Payment/PaymentService
    recipientActivity: from

  - actor: Payment/PaymentService
    activity: asks to authorize and capture
    workObject: Charge
    recipient: Payment/PaymentProvider
    recipientActivity: with

  - actor: Payment/PaymentProvider
    activity: reports the captured
    workObject: Charge
    recipient: Payment/PaymentService
    recipientActivity: to

  - actor: Payment/PaymentService
    activity: reports the captured
    workObject: Payment
    recipient: Order/OrderManagementService
    recipientActivity: to, which places the order

  - actor: Checkout/Customer
    activity: views
    workObject: Order
    recipient: Order/OrderManagementService
