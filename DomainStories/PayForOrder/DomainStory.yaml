# A domain story told in the Payment domain language
# (DomainLanguages/Payment). Every name below is an actor or a work object
# of that language. No coordinates: the editor lays the story out the first
# time it is opened.
name: Payer pays for an order
description: >-
  The payer pays for an order at checkout. The payment service asks the
  payment provider to authorize a charge and records the answer; once the
  payment is authorized the provider captures the charge. A payment left
  abandoned is canceled and its authorization voided. The payer can ask for a
  refund, which the provider pays back, and can see where the payment stands.

sentences:
  - actor: Payer
    activity: enters
    workObject: PaymentMethod
    recipient: PaymentService

  - actor: PaymentService
    activity: asks to authorize
    workObject: Payment
    recipient: PaymentProvider

  - actor: PaymentProvider
    activity: reports
    workObject: Charge
    recipient: PaymentService
    recipientActivity: to

  - actor: PaymentService
    activity: asks to capture
    workObject: Payment
    recipient: PaymentProvider

  - actor: PaymentProvider
    activity: reports the captured
    workObject: Charge
    recipient: PaymentService
    recipientActivity: to

  - actor: PaymentService
    activity: cancels the abandoned
    workObject: Payment
    recipient: PaymentProvider
    recipientActivity: with

  - actor: Payer
    activity: requests
    workObject: Refund
    recipient: PaymentService
    recipientActivity: from

  - actor: PaymentService
    activity: asks to pay back
    workObject: Refund
    recipient: PaymentProvider

  - actor: PaymentProvider
    activity: reports the refunded
    workObject: Charge
    recipient: PaymentService
    recipientActivity: to

  - actor: Payer
    activity: checks
    workObject: Payment
    recipient: PaymentService
    recipientActivity: with
