# A domain story told in the Payment domain language
# (DomainLanguages/Payment). Every name below is an actor or a work object
# of that language. No coordinates: the editor lays the story out the first
# time it is opened.
name: Payer pays for an order
description: >-
  The payer pays for an order at checkout. The payment service initiates and
  authorizes the payment with the payment provider, captures it once it is
  authorized, and later refunds it when the payer asks.

sentences:
  - actor: Payer
    activity: enters
    workObject: PaymentMethod
    recipient: PaymentService

  - actor: PaymentService
    activity: initiates
    workObject: Payment
    recipient: PaymentProvider
    recipientActivity: with

  - actor: PaymentService
    activity: authorizes
    workObject: Payment
    recipient: PaymentProvider
    recipientActivity: with

  - actor: PaymentProvider
    activity: reports
    workObject: PaymentAttempt
    recipient: PaymentService
    recipientActivity: to

  - actor: PaymentService
    activity: captures
    workObject: Payment
    recipient: PaymentProvider
    recipientActivity: with

  - actor: Payer
    activity: requests
    workObject: Refund
    recipient: PaymentService
    recipientActivity: from

  - actor: PaymentService
    activity: refunds
    workObjects: [Refund, Payment]
    recipient: PaymentProvider
    recipientActivity: through
